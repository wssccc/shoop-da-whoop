# Workflow for building and deploying a Vite static site to GitHub Pages.
#
# Builds the project with `npm run build` (vite build) and publishes the
# generated `dist/` directory. vite.config.js sets `base: './'` so the site
# works correctly under the GitHub Pages sub-path.
#
name: Deploy Vite site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["master"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          # Project ships a package-lock.json → npm is the package manager.
          cache: "npm"
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Restore Vite cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules/.vite
          # Generate a new cache whenever packages, config, or source files change.
          key: ${{ runner.os }}-vite-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/vite.config.*', '**/postcss.config.*', '**/index.html', '**.[jt]s', '**.[jt]sx') }}
          # If source files changed but packages didn't, rebuild from a prior cache.
          restore-keys: |
            ${{ runner.os }}-vite-${{ hashFiles('**/package-lock.json') }}-
      - name: Install dependencies
        run: npm ci
      # Compatibility gate: eslint-plugin-compat reads .browserslistrc and
      # fails the build if any source uses an API/syntax newer than the
      # iOS 13 / Safari 13 floor (e.g. structuredClone, Array.at, ??).
      - name: Lint
        run: npm run lint
      - name: Build with Vite
        run: npm run build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
