<!DOCTYPE html>
<html lang="zh-cn">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#f3ede1" />
  <title>1A2B · 猜数字</title>
  <script>
    (function () {
      try {
        var t = localStorage.getItem('sz1a2b.theme');
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = t;
      } catch (e) {
        document.documentElement.dataset.theme = 'light';
      }
    })();
  </script>
  <link rel="stylesheet" href="../../shared/styles/reset.css" />
  <link rel="stylesheet" href="./css/style.css" />
</head>

<body>
  <main id="app">
    <!-- Toolbar: back / title / stats / controls -->
    <header class="toolbar">
      <a class="tbtn tbtn-back" href="../../index.html" title="返回首页" aria-label="返回首页">←</a>
      <div class="title-block">
        <h1 class="game-title">1<span class="title-a">A</span>2<span class="title-b">B</span></h1>
        <p class="subtitle">FIRIN&#39; NUMBERS AT YA</p>
      </div>
      <div class="stats" id="stats" title="统计"></div>
      <div class="controls">
        <button class="tbtn" id="btn-theme" title="主题 (T)" aria-label="主题">🌗</button>
        <button class="tbtn" id="btn-mute" title="静音 (M)" aria-label="静音">🔊</button>
        <button class="tbtn" id="btn-new" title="新局 (N)" aria-label="新局">⟳</button>
        <button class="tbtn" id="btn-reset" title="清除记录" aria-label="清除记录">🗑</button>
        <button class="tbtn" id="btn-fullscreen" title="全屏 (F)" aria-label="全屏">⛶</button>
      </div>
    </header>

    <!-- Guess history (newest at bottom, auto-scrolls) -->
    <section class="history" id="history" aria-label="猜测历史">
      <div class="history-empty" id="history-empty">输入 4 位不重复数字，猜中即 4A0B</div>
    </section>

    <!-- Current input display: 4 slots -->
    <section class="input-display" id="input-display" aria-label="当前输入"></section>

    <!-- Telephone-style number keypad -->
    <section class="keypad" id="keypad" aria-label="数字键盘">
      <button class="key" data-key="1">1</button>
      <button class="key" data-key="2">2</button>
      <button class="key" data-key="3">3</button>
      <button class="key" data-key="4">4</button>
      <button class="key" data-key="5">5</button>
      <button class="key" data-key="6">6</button>
      <button class="key" data-key="7">7</button>
      <button class="key" data-key="8">8</button>
      <button class="key" data-key="9">9</button>
      <button class="key key-back" data-key="back" title="退格" aria-label="退格">⌫</button>
      <button class="key" data-key="0">0</button>
      <button class="key key-clear" data-key="clear" title="清空" aria-label="清空">C</button>
      <button class="key key-fire" data-key="fire" title="提交 (Enter)">⚡ 提交</button>
    </section>

    <!-- Toast notifications (achievements) -->
    <div class="toasts" id="toasts" aria-live="polite"></div>

    <!-- Win celebration overlay -->
    <div class="overlay win-overlay" id="win-overlay" hidden>
      <div class="win-content">
        <div class="win-stamp">命中</div>
        <div class="win-splash" aria-hidden="true"></div>
        <div class="win-shoop">SHOOP DA WHOOP!</div>
        <div class="win-result" id="win-result"></div>
        <button class="btn-primary" id="win-again">再来一局</button>
      </div>
    </div>

    <!-- Generic confirm dialog overlay -->
    <div class="overlay confirm-overlay" id="confirm-overlay" hidden>
      <div class="confirm-box">
        <p class="confirm-msg" id="confirm-msg"></p>
        <div class="confirm-actions">
          <button class="btn-ghost" id="confirm-cancel">取消</button>
          <button class="btn-primary" id="confirm-ok">确认</button>
        </div>
      </div>
    </div>
  </main>

  <script type="module" src="./js/main.js"></script>
</body>

</html>
