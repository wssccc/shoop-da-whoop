<!DOCTYPE html>
<html lang="zh-cn">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#000000" />
  <title>1A2B · 建设中</title>
  <link rel="stylesheet" href="../../shared/styles/reset.css" />
  <style>
    :root {
      --bg: #000;
      --accent: #39ff14;
      --warn: #ff6600;
    }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: #fff;
      font-family: "Comic Sans MS", "MS Sans Serif", system-ui, sans-serif;
      text-align: center;
      padding: 1rem;
    }
    .badge {
      display: inline-block;
      background: var(--warn);
      color: #000;
      padding: 0.25rem 0.75rem;
      font-weight: bold;
      transform: rotate(-3deg);
      margin-bottom: 1rem;
    }
    h1 {
      font-size: clamp(2rem, 8vw, 4rem);
      color: var(--accent);
      text-shadow: 0 0 8px var(--accent);
      letter-spacing: 0.1em;
    }
    p {
      margin-top: 0.75rem;
      color: #ccc;
    }
    .back {
      display: inline-block;
      margin-top: 1.5rem;
      padding: 0.5rem 1rem;
      border: 2px solid var(--accent);
      color: var(--accent);
    }
    .back:hover {
      background: var(--accent);
      color: #000;
    }
  </style>
</head>

<body>
  <main>
    <span class="badge">🚧 UNDER CONSTRUCTION 🚧</span>
    <h1>1A2B</h1>
    <p>猜数字游戏正在施工中，敬请期待。</p>
    <a class="back" href="../../index.html">← 返回首页</a>
  </main>
</body>

</html>
