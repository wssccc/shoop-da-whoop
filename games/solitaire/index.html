<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#08160e" />
    <title>接龙 · Solitaire</title>
    <!-- Preload the win-card face animation so /images/2.gif (native 200×150,
         ~460 KB) is decoded before the victory emblem flips to it. The
         solitaire entry never visits the root collage that otherwise warms
         these, so without this the first victory flickers while the gif
         streams in. -->
    <link rel="preload" href="/images/2.gif" as="image" type="image/gif" />
  </head>
  <body>
    <div id="root"></div>
    <!-- Entry module. Vite resolves it for dev/build; @vitejs/plugin-legacy
         automatically emits a <script nomodule> fallback for iOS 13 / Safari 13. -->
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
