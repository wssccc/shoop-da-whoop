  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover" />

    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <meta name="apple-mobile-web-app-title" content="Shoop Da Whoop" />
    <link rel="apple-touch-icon" href="/pwa/apple-touch-icon.png" />
    <!-- Preload all three win-card face gifs (native 99×99 / 200×150 /
         250×108, ~719 KB total) — the victory emblem lands on ONE of them
         (hash-picked from the last collected card, see src/lib/winGif.ts),
         so each must be decoded before the flip. The solitaire entry never
         visits the root collage that otherwise warms these, so without
         this the first victory flickers while the gif streams in. -->
    <link rel="preload" href="/images/1.gif" as="image" type="image/gif" />
    <link rel="preload" href="/images/2.gif" as="image" type="image/gif" />
    <link rel="preload" href="/images/3.gif" as="image" type="image/gif" />
  </head>
  <body>
    <div id="root"></div>
    <!-- Entry module. Vite resolves it for dev/build; @vitejs/plugin-legacy
         automatically emits a <script nomodule> fallback for iOS 13 / Safari 13. -->
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
